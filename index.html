<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FBCP Online Anonymous Voting</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #2d3748;
    }
    .instructions {
      font-size: 0.95rem;
      color: #4a5568;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    #motionTitle {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 16px 0 28px;
      line-height: 1.4;
      color: #1a365d;
      min-height: 60px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    button.vote {
      flex: 1;
      padding: 22px 12px;
      font-size: 1.4rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button.vote:active { transform: scale(0.97); }
    button.for { background: #38a169; }
    button.against { background: #e53e3e; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .qr-section {
      margin: 10px 0 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    .qr-section img {
      width: 180px;
      height: 180px;
      border-radius: 12px;
    }
    .qr-label {
      font-size: 0.9rem;
      color: #4a5568;
      margin-top: 10px;
    }
    .refresh-btn {
      background: #4a5568;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .counts {
      display: none;
      justify-content: space-around;
      margin-bottom: 20px;
      font-size: 1.8rem;
      font-weight: 700;
    }
    .counts.visible {
      display: flex;
    }
    .count-for { color: #38a169; }
    .count-against { color: #e53e3e; }
    #status {
      font-size: 1.1rem;
      margin-bottom: 24px;
      min-height: 28px;
      color: #4a5568;
    }
    .admin-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      text-align: left;
    }
    .admin-section h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #718096;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .admin-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-buttons button {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: white;
    }
    #showResultsBtn { background: #805ad5; }
    #changeMotionBtn { background: #3182ce; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>FBCP Online Anonymous Voting</h1>
    <div class="instructions">
      To Vote go to: <strong>fbcp.vercel.app</strong><br>
      on your web browser (Safari / Chrome)
    </div>

    <div id="motionTitle">Loading current motion...</div>

    <div class="buttons">
      <button class="vote for" id="forBtn" onclick="castVote('for')">FOR</button>
      <button class="vote against" id="againstBtn" onclick="castVote('against')">AGAINST</button>
    </div>

    <!-- QR Code Section -->
    <div class="qr-section">
      <img src="fbcpvote-qr.png" alt="Scan to vote" />
      <div class="qr-label">Scan this QR code to open the voting page</div>
    </div>

    <button class="refresh-btn" onclick="location.reload()">Refresh</button>

    <div class="counts" id="results">
      <div class="count-for">FOR: <span id="forCount">0</span></div>
      <div class="count-against">AGAINST: <span id="againstCount">0</span></div>
    </div>

    <div id="status"></div>

    <div class="admin-section">
      <h3>Admin (password protected)</h3>
      <input type="password" id="adminPass" placeholder="Enter admin password" />
      
      <div id="adminControls" class="hidden">
        <button id="showResultsBtn" onclick="toggleResults()">Show Results</button>
        
        <textarea id="newMotion" rows="3" placeholder="Type the next motion here..."></textarea>
        <div class="admin-buttons">
          <button id="changeMotionBtn" onclick="updateMotion()">Update Motion & Reset Votes</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB7sO4M3d2acWopSxaPRq36RiS8iiudTEI",
      authDomain: "church-voting-43507.firebaseapp.com",
      databaseURL: "https://church-voting-43507-default-rtdb.firebaseio.com",
      projectId: "church-voting-43507",
      storageBucket: "church-voting-43507.firebasestorage.app",
      messagingSenderId: "521207359021",
      appId: "1:521207359021:web:a4576aaa8039aa27f5baa4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_PASSWORD = "churchvote2026";
    let resultsVisible = false;
    let currentSession = null;

    db.ref("motion").on("value", (snap) => {
      const title = snap.val() || "No motion set yet";
      document.getElementById("motionTitle").textContent = title;
    });

    db.ref("votes").on("value", (snap) => {
      const data = snap.val() || { for: 0, against: 0 };
      document.getElementById("forCount").textContent = data.for || 0;
      document.getElementById("againstCount").textContent = data.against || 0;
    });

    db.ref("sessionId").on("value", (snap) => {
      currentSession = snap.val() || "default";
      checkIfAlreadyVoted();
    });

    function checkIfAlreadyVoted() {
      const votedSession = localStorage.getItem("votedSession");

      if (votedSession === currentSession) {
        disableButtons();
        document.getElementById("status").textContent = "You have already voted on this motion.";
      } else {
        enableButtons();
        document.getElementById("status").textContent = "";
      }
    }

    function castVote(choice) {
      const votedSession = localStorage.getItem("votedSession");
      if (votedSession === currentSession) return;

      db.ref("votes/" + choice).transaction((current) => (current || 0) + 1);

      localStorage.setItem("votedSession", currentSession);
      disableButtons();
      document.getElementById("status").textContent = "Thank you — your vote has been recorded.";
    }

    function disableButtons() {
      document.getElementById("forBtn").disabled = true;
      document.getElementById("againstBtn").disabled = true;
    }

    function enableButtons() {
      document.getElementById("forBtn").disabled = false;
      document.getElementById("againstBtn").disabled = false;
    }

    document.getElementById("adminPass").addEventListener("input", function () {
      if (this.value === ADMIN_PASSWORD) {
        document.getElementById("adminControls").classList.remove("hidden");
      } else {
        document.getElementById("adminControls").classList.add("hidden");
      }
    });

    function toggleResults() {
      resultsVisible = !resultsVisible;
      const resultsDiv = document.getElementById("results");
      const btn = document.getElementById("showResultsBtn");

      if (resultsVisible) {
        resultsDiv.classList.add("visible");
        btn.textContent = "Hide Results";
      } else {
        resultsDiv.classList.remove("visible");
        btn.textContent = "Show Results";
      }
    }

    function updateMotion() {
      const text = document.getElementById("newMotion").value.trim();
      if (!text) return alert("Please type a motion first.");

      db.ref("motion").set(text);
      db.ref("votes").set({ for: 0, against: 0 });

      const newSession = Date.now().toString();
      db.ref("sessionId").set(newSession);

      resultsVisible = false;
      document.getElementById("results").classList.remove("visible");
      document.getElementById("showResultsBtn").textContent = "Show Results";

      document.getElementById("newMotion").value = "";
      alert("Motion updated and votes reset.\n\nMembers should press the Refresh button to vote on the new motion.");
    }
  </script>
</body>
</html>
