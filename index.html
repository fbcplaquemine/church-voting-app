<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Church Business Meeting Vote</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #2d3748;
    }
    #motionTitle {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 16px 0 32px;
      line-height: 1.4;
      color: #1a365d;
      min-height: 70px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    button.vote {
      flex: 1;
      padding: 24px 12px;
      font-size: 1.5rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button.vote:active { transform: scale(0.97); }
    button.for { background: #38a169; }
    button.against { background: #e53e3e; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #status {
      font-size: 1.15rem;
      margin-bottom: 20px;
      min-height: 30px;
      color: #2d3748;
      font-weight: 500;
    }
    .admin-section {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      text-align: left;
    }
    .admin-section h3 {
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: #718096;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .admin-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .admin-buttons button {
      flex: 1;
      padding: 13px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: white;
    }
    #changeMotionBtn { background: #3182ce; }
    #resetBtn { background: #dd6b20; }
    .hidden { display: none; }
    .admin-counts {
      display: flex;
      justify-content: space-around;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Church Business Meeting</h1>
    <div id="motionTitle">Loading current motion...</div>

    <div class="buttons" id="voteButtons">
      <button class="vote for" id="forBtn" onclick="castVote('for')">FOR</button>
