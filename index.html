<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Church Business Meeting Vote</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #2d3748;
    }
    #motionTitle {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 16px 0 28px;
      line-height: 1.4;
      color: #1a365d;
      min-height: 60px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }
    button.vote {
      flex: 1;
      padding: 22px 12px;
      font-size: 1.4rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button.vote:active { transform: scale(0.97); }
    button.for { background: #38a169; }
    button.against { background: #e53e3e; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .counts {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      font-size: 1.8rem;
      font-weight: 700;
    }
    .count-for { color: #38a169; }
    .count-against { color: #e53e3e; }
    #status {
      font-size: 1.1rem;
      margin-bottom: 24px;
      min-height: 28px;
      color: #4a5568;
    }
